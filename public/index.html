<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Lab</title>
<meta name="description" content="Sketch block diagrams of radios and other signal chains, simulate them, and plot or listen anywhere along the way.">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-name">Signal Lab</span>
    <span class="doc-title" id="doc-title"></span>
  </div>
  <div class="toolbar" role="toolbar" aria-label="Diagram">
    <select id="examples" aria-label="Load an example">
      <option value="" selected disabled hidden>Examples…</option>
    </select>
    <button type="button" id="new">New</button>
    <button type="button" id="import">Open…</button>
    <button type="button" id="export">Save…</button>
    <span class="divider" aria-hidden="true"></span>
    <button type="button" id="undo" title="Undo (⌘Z)">Undo</button>
    <button type="button" id="redo" title="Redo (⇧⌘Z)">Redo</button>
    <button type="button" id="fit" title="Fit the diagram to the window">Fit</button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</header>
<main class="workspace">
  <nav class="palette" id="palette" aria-label="Blocks"></nav>
  <section class="canvas" id="canvas" aria-label="Diagram"></section>
  <aside class="inspector" id="inspector" aria-label="Settings"></aside>
  <section class="bench" id="bench" aria-label="Signals"></section>
</main>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<noscript><p class="noscript">Signal Lab runs in the browser and needs JavaScript.</p></noscript>
</body>
</html>
